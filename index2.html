<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Chat</title>
<style>
  body { font-family: sans-serif; background: #0e1621; color: #e6edf3; margin: 0; padding: 15px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #243447; background: #17212b; color: white; font-size: 16px; box-sizing: border-box; }
  button { background: #2b5278; border: none; cursor: pointer; font-weight: bold; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  
  #chatList { flex: 1; overflow-y: auto; }
  .user-item { padding: 15px; background: #17212b; margin-bottom: 8px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .user-item:active { background: #243447; }
  
  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
  .chat-header button { width: auto; padding: 8px 15px; margin: 0; background: #243447; }
  #messages { flex: 1; overflow-y: auto; background: #17212b; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
  .msg { padding: 8px; border-radius: 8px; max-width: 80%; font-size: 14px; }
  .msg.me { background: #2b5278; align-self: flex-end; }
  .msg.them { background: #182533; align-self: flex-start; }
  .input-row { display: flex; gap: 5px; }
  .input-row input { margin: 0; }
  .input-row button { width: auto; margin: 0; padding: 12px 20px; }
</style>
</head>
<body>

<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="login" placeholder="Логин">
  <input id="pass" type="password" placeholder="Пароль">
  <button onclick="reg()">Зарегистрироваться</button>
  <button onclick="log()" style="background:#1c2a3a;">Войти</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 style="margin:0;">Мои чаты</h3>
      <button onclick="logout()" style="width:auto; padding:5px 10px; background:#7a2b2b;">Выйти</button>
    </div>
    <input id="searchUser" placeholder="Найти пользователя по логину..." oninput="searchUsers()" style="margin-bottom:15px;">
    <div id="chatList"></div>
  </div>

  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button onclick="backToList()">← Назад</button>
      <h4 id="chatWith" style="margin:0;"></h4>
    </div>
    <div id="messages"></div>
    <div class="input-row">
      <input id="msgInput" placeholder="Сообщение...">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const err = document.getElementById('error');
let myLogin = "";
let currentChatWith = "";

function reg() {
  const login = document.getElementById('login').value;
  const pass = document.getElementById('pass').value;
  if(!login || !pass) return err.innerText = "Заполните всё";
  socket.emit('register', { login, pass });
}

function log() {
  const login = document.getElementById('login').value;
  const pass = document.getElementById('pass').value;
  socket.emit('login', { login, pass });
}

function logout() { location.reload(); }

socket.on('registered', () => { err.innerText = "Готово! Теперь нажми Войти"; err.style.color = "green"; });
socket.on('error', (msg) => { err.innerText = msg; err.style.color = "red"; });

socket.on('logged_in', (user) => {
  myLogin = user;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  socket.emit('get_users');
});

socket.on('users_list', (users) => {
  const box = document.getElementById('chatList');
  box.innerHTML = "";
  const search = document.getElementById('searchUser').value.toLowerCase();
  
  users.forEach(u => {
    if (u === myLogin) return;
    if (search && !u.toLowerCase().includes(search)) return;
    const div = document.createElement('div');
    div.className = "user-item";
    div.innerHTML = `<span>@${u}</span> <span>➤</span>`;
    div.onclick = () => openChat(u);
    box.appendChild(div);
  });
  if (box.innerHTML === "") box.innerHTML = "<p style='color:#7d8b99; text-align:center;'>Пользователи не найдены</p>";
});

function searchUsers() { socket.emit('get_users'); }

function openChat(user) {
  currentChatWith = user;
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = "@" + user;
  document.getElementById('messages').innerHTML = "";
  socket.emit('join_chat', user);
}

function backToList() {
  currentChatWith = "";
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('listScreen').classList.remove('hidden');
  socket.emit('leave_chat');
}

socket.on('new_message', (data) => {
  if (currentChatWith === data.from || currentChatWith === data.to) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + (data.from === myLogin ? 'me' : 'them');
    div.innerText = data.text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
});

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentChatWith) return;
  socket.emit('private_message', { to: currentChatWith, text: text });
  input.value = "";
}
</script>
</body>
</html>
