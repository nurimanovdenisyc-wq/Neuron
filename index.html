<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neuron</title>
<style>
  :root { --bg: #0e1621; --bg2: #17212b; --bg3: #1c2a3a; --text: #e6edf3; --muted: #7d8b99; --accent: #2b5278; --me: #2b5278; --them: #182533; --border: #243447; }
  body.light { --bg: #f0f2f5; --bg2: #ffffff; --bg3: #e4e8ec; --text: #1a1a1a; --muted: #6a737d; --accent: #d9ebff; --me: #d9ebff; --them: #ffffff; --border: #d0d7de; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; height: 100dvh; display: flex; flex-direction: column; transition: background 0.3s; }
  .hidden { display: none !important; }
  input, button, textarea { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 16px; outline: none; direction: ltr; text-align: left; }
  button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--bg2); padding: 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .topbar .title { flex: 1; font-size: 20px; font-weight: 700; }
  .topbar button { width: auto; padding: 8px 12px; margin: 0; font-size: 14px; background: var(--bg3); }

  #chatList { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { padding: 12px; background: var(--bg2); margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; position: relative; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: bold; font-size: 16px; }
  .chat-last { font-size: 13px; color: var(--muted); }

  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { background: var(--bg2); padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .chat-header button { width: auto; padding: 8px; margin: 0; background: transparent; font-size: 20px; color: var(--text); }
  #chatBio { font-size: 12px; color: var(--muted); }

  #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background-color: var(--bg); position: relative; }
  #wallLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-size: cover; background-position: center; pointer-events: none; transition: filter 0.3s; }

  .msg { max-width: 80%; padding: 10px 14px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; direction: ltr; text-align: left; z-index: 1; }
  .msg.me { background: var(--me); align-self: flex-end; color: white; }
  .msg.them { background: var(--them); align-self: flex-start; border: 1px solid var(--border); }
  .msg .sender { font-size: 12px; color: #58a6ff; font-weight: bold; margin-bottom: 4px; cursor: pointer; }
  .msg .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid #58a6ff; padding: 4px 8px; font-size: 12px; margin-bottom: 5px; border-radius: 4px; }

  .input-bar { background: var(--bg2); padding: 8px 10px; display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border); position: relative; z-index: 10; }
  .input-bar button { width: auto; padding: 12px; margin: 0; border-radius: 50%; font-size: 20px; background: var(--bg3); flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 44px; width: 44px; }
  .input-bar input { margin: 0; border-radius: 20px; padding: 12px 16px; resize: none; max-height: 120px; min-height: 44px; flex: 1; }
  .input-bar .send-btn { background: var(--accent); color: white; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; padding: 20px; z-index: 100; }
  .modal.show { display: flex; }
  .modal-box { background: var(--bg2); padding: 20px; border-radius: 16px; max-height: 80vh; overflow-y: auto; }

  .profile-header { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
  .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; overflow: hidden; }
  
  .game-area { position: relative; height: 300px; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .game-target { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: #f5c518; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="nick" placeholder="Ник (мин. 3 символа)" autocomplete="username" dir="ltr">
  <input id="password" type="password" placeholder="Пароль (мин. 4 символа)" autocomplete="current-password" dir="ltr">
  <button onclick="doAuth('/api/login')">Войти</button>
  <button onclick="doAuth('/api/register')" style="background:#6d28d9;">Зарегистрироваться</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar">
      <div class="title">Чаты</div>
      <button onclick="openProfile(myNick)">👤</button>
      <button onclick="openGifts()">🎁</button>
      <button onclick="toggleTheme()">🌓</button>
      <button onclick="logout()" style="background:#7a2b2b;">Выйти</button>
    </div>
    <div style="display:flex; gap:8px; padding: 10px; flex-wrap:wrap;">
      <button onclick="openSearch()" style="flex:1;">🔍 Поиск</button>
      <button onclick="createBotPrompt()" style="background:#db2777; flex:1;">🤖 Бот</button>
      <button id="devBtn" class="hidden" onclick="openDevPanel()" style="background:#8b5cf6; flex:1;">DEV</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button onclick="backToList()">←</button>
      <div class="avatar" id="chatAvatar" style="width:40px; height:40px; font-size:16px;"></div>
      <div style="flex:1;">
        <div class="chat-name" id="chatWith"></div>
        <div id="chatBio"></div>
      </div>
    </div>
    <div id="messages"><div id="wallLayer"></div></div>
    <div class="input-bar">
      <button onclick="send()" class="send-btn">➤</button>
      <input id="msgInput" placeholder="Сообщение..." dir="ltr">
    </div>
  </div>
</div>

<input type="file" id="avatarGalleryInput" accept="image/*" class="hidden" onchange="uploadAvatar(event)">

<!-- Модалки -->
<div class="modal" id="searchModal">
  <div class="modal-box">
    <h3>Поиск по нику</h3>
    <input id="searchInput" placeholder="Введите ник..." oninput="doSearch()" dir="ltr">
    <div id="searchResults"></div>
    <button onclick="closeModal('searchModal')" style="background:var(--bg3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="profileModal">
  <div class="modal-box">
    <div class="profile-header">
      <div class="profile-avatar" id="profAvatar"></div>
      <h3 id="profNick"></h3>
      <div id="profStatus" style="color:var(--muted);"></div>
      <div id="profStars" style="color:#f5c518;"></div>
    </div>
    <div id="profBio" style="margin-bottom:10px;"></div>
    <div id="profEdit" class="hidden">
      <input id="editBio" placeholder="О себе">
      <button onclick="document.getElementById('avatarGalleryInput').click()" style="background:#2563eb; margin-bottom:10px;">📸 Загрузить аватар</button>
      <button onclick="saveProfile()">Сохранить</button>
    </div>
    <button id="profMsgBtn" class="hidden" onclick="messageProfile()">Написать</button>
    <button onclick="closeModal('profileModal')" style="background:var(--bg3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="giftsModal">
  <div class="modal-box">
    <h3>Нейрон Подарки</h3>
    <div id="starsBalance" style="font-size:18px; margin-bottom:10px;"></div>
    
    <!-- Витрина подарков -->
    <div id="giftsGrid" style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:15px;">
      <!-- Заполняется скриптом -->
    </div>

    <button onclick="openPremium()" style="background:linear-gradient(90deg, #f5c518, #d4af37); color:#000; margin-top:10px;">💎 Нейрон Премиум</button>
    <button onclick="openGame()" style="background:#f5c518; color:#000; margin-top:10px;">🎮 Нейрон Геймс</button>
    <button onclick="closeModal('giftsModal')" style="background:var(--bg3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="premiumModal">
  <div class="modal-box" style="text-align:center;">
    <h3 style="color:#f5c518;">💎 Нейрон Премиум</h3>
    <div style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
      <button onclick="buyPremium(1)" style="background:#333;">1 месяц — 1000 ⭐</button>
      <button onclick="buyPremium(3)" style="background:#333;">3 месяца — 5000 ⭐</button>
      <button onclick="buyPremium(12)" style="background:#333;">1 год — 50000 ⭐</button>
    </div>
    <button onclick="closeModal('premiumModal')" style="background:var(--bg3); margin-top:15px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="gameModal">
  <div class="modal-box">
    <h3>Neuron Games</h3>
    <div id="gameTimer" style="font-size:16px; margin-bottom:10px;"></div>
    <div id="gameScore" style="font-size:16px; margin-bottom:10px;"></div>
    <div class="game-area" id="gameArea"></div>
    <button onclick="closeModal('gameModal')" style="background:var(--bg3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myNick = "", currentChatId = "";
let isLightTheme = false;

// --- АВТОРИЗАЦИЯ ---
async function doAuth(path) {
  const nick = document.getElementById('nick').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('error');
  err.innerText = '';
  try {
    const res = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nick, password })
    });
    const data = await res.json();
    if (!res.ok) { err.innerText = data.error || 'Ошибка'; return; }
    onLoggedIn(data.nick);
  } catch (e) { err.innerText = 'Сеть недоступна'; }
}

function onLoggedIn(nick) {
  myNick = nick;
  socket.emit('login_nick', nick);
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (myNick === "keshaneironchik") document.getElementById('devBtn').classList.remove('hidden');
  socket.emit('get_chats');
  socket.emit('get_gifts');
}

// --- ЧАТЫ ---
socket.on('chats_list', (chats) => {
  const box = document.getElementById('chatList'); box.innerHTML = "";
  chats.forEach(c => {
    const div = document.createElement('div'); div.className = "chat-item";
    div.onclick = () => openChat(c.id, c.name);
    div.innerHTML = `<div class="avatar">${c.name.charAt(0).toUpperCase()}</div>
      <div class="chat-info"><div class="chat-name">${c.name}</div></div>`;
    box.appendChild(div);
  });
});

function openChat(id, name) {
  currentChatId = id;
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  socket.emit('join_chat', id);
}

function backToList() { currentChatId = ""; document.getElementById('chatScreen').classList.add('hidden'); document.getElementById('listScreen').classList.remove('hidden'); socket.emit('get_chats'); }

socket.on('messages_history', (msgs) => {
  const box = document.getElementById('messages'); box.innerHTML = '<div id="wallLayer"></div>';
  msgs.forEach(m => renderMsg(m));
});
socket.on('new_message', (m) => { if (currentChatId === m.chat_id) renderMsg(m); });

function renderMsg(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  const isMe = m.sender === myNick;
  div.className = 'msg ' + (isMe ? 'me' : 'them');
  let content = '';
  if (!isMe) content += `<div class="sender">${m.sender}</div>`;
  content += `<div>${m.text}</div>`;
  div.innerHTML = content;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  socket.emit('send_message', { chatId: currentChatId, text: text, type: 'text' });
  input.value = "";
}

// --- ПОДАРКИ И ПРЕМИУМ ---
const GIFTS = [
  { id: "rose", emoji: "🌹", name: "Роза", price: 1 },
  { id: "heart", emoji: "❤️", name: "Сердце", price: 3 },
  { id: "bear", emoji: "🧸", name: "Мишка", price: 5 },
  { id: "crown", emoji: "👑", name: "Корона", price: 15 },
  { id: "rocket", emoji: "🚀", name: "Ракета", price: 10 },
  { id: "clover", emoji: "🍀", name: "Клевер", price: 100 }
];

function openGifts() {
  document.getElementById('giftsModal').classList.add('show');
  const grid = document.getElementById('giftsGrid');
  grid.innerHTML = '';
  GIFTS.forEach(g => {
    const btn = document.createElement('button');
    btn.innerHTML = `${g.emoji} ${g.name}<br><small>${g.price} ⭐</small>`;
    btn.style.cssText = 'background:var(--bg3); padding:10px; font-size:14px; margin:0;';
    btn.onclick = () => { 
      socket.emit('buy_gift', { to: myNick, giftId: g.id, skin: 'Классика' }); 
      alert(`Вы подарили себе ${g.name}!`); 
    };
    grid.appendChild(btn);
  });
}

function openPremium() { closeModal('giftsModal'); document.getElementById('premiumModal').classList.add('show'); }
function buyPremium(m) { socket.emit('buy_premium', m); }
socket.on('premium_bought', () => { alert('Премиум активирован!'); closeModal('premiumModal'); });

// --- ИГРА ---
let gameInterval;
function openGame() {
  closeModal('giftsModal');
  document.getElementById('gameModal').classList.add('show');
  const area = document.getElementById('gameArea');
  area.innerHTML = '';
  let score = 0;
  document.getElementById('gameScore').innerText = 'Счёт: 0';
  document.getElementById('gameTimer').innerText = 'Время: 15';
  
  gameInterval = setInterval(() => {
    const target = document.createElement('div');
    target.className = 'game-target';
    target.innerText = '⭐';
    target.style.left = Math.random() * (area.clientWidth - 50) + 'px';
    target.style.top = Math.random() * (area.clientHeight - 50) + 'px';
    target.onclick = () => {
      score++;
      document.getElementById('gameScore').innerText = 'Счёт: ' + score;
      target.remove();
    };
    area.appendChild(target);
    setTimeout(() => target.remove(), 1000);
  }, 500);

  let time = 15;
  const timer = setInterval(() => {
    time--;
    document.getElementById('gameTimer').innerText = 'Время: ' + time;
    if (time <= 0) {
      clearInterval(timer);
      clearInterval(gameInterval);
      alert('Игра окончена! Ваш счёт: ' + score);
    }
  }, 1000);
}

// --- ПРОЧЕЕ ---
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function logout() { location.reload(); }
function toggleTheme() { isLightTheme = !isLightTheme; document.body.classList.toggle('light', isLightTheme); }
function createBotPrompt() {
  const name = prompt("Имя бота:"); if (!name) return;
  socket.emit('create_bot', { name, persona: 'дружелюбный' });
  alert("Бот создан!");
}
function openDevPanel() { alert("DEV панель пока в разработке"); }
</script>
</body>
  </html>
