<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neuron</title>
<style>
  body { font-family: sans-serif; background: #0e1621; color: #e6edf3; margin: 0; padding: 15px; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #243447; background: #17212b; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
  button { background: #2b5278; border: none; cursor: pointer; font-weight: bold; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chatList { flex: 1; overflow-y: auto; padding-bottom: 70px; }
  .chat-item { padding: 15px; background: #17212b; margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 45px; height: 45px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; overflow: hidden; flex-shrink: 0; }
  .chat-name { font-weight: bold; font-size: 16px; }
  .chat-bio { font-size: 13px; color: #7d8b99; }
  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; background: #17212b; padding: 10px; border-radius: 10px; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
  .msg.me { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.them { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .sender { font-size: 12px; color: #58a6ff; font-weight: bold; margin-bottom: 3px; }
  .input-row { display: flex; gap: 5px; align-items: flex-end; }
  .input-row button { width: auto; margin: 0; padding: 12px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; padding: 20px; z-index: 100; }
  .modal.show { display: flex; }
  .modal-box { background: #17212b; padding: 20px; border-radius: 16px; max-height: 80vh; overflow-y: auto; }
</style>
</head>
<body>
<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="email" type="email" placeholder="Введите вашу почту">
  <button onclick="login()">Войти / Зарегистрироваться</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0;">Мои чаты</h3>
      <button onclick="logout()" style="width:auto; padding:8px 12px; background:#7a2b2b;">Выйти</button>
    </div>
    <div style="display:flex; gap:5px; margin-bottom:10px;">
      <button onclick="openSearch()" style="padding:8px;">🔍 Поиск</button>
      <button onclick="createGroup()" style="padding:8px; background:#6d28d9;">+ Группа</button>
      <button onclick="createChannel()" style="padding:8px; background:#238636;">+ Канал</button>
      <button id="devBtn" class="hidden" onclick="openDevPanel()" style="padding:8px; background:#8b5cf6;">DEV</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button onclick="backToList()" style="width:auto; background:transparent; font-size:20px;">←</button>
      <div style="flex:1;">
        <div class="chat-name" id="chatWith"></div>
        <div class="chat-bio" id="chatBio"></div>
      </div>
    </div>
    <div id="messages"></div>
    <div class="input-row">
      <input id="msgInput" placeholder="Сообщение...">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- Модалка поиска -->
<div class="modal" id="searchModal">
  <div class="modal-box">
    <h3>Поиск людей</h3>
    <input id="searchInput" placeholder="Введите почту..." oninput="doSearch()">
    <div id="searchResults"></div>
    <button onclick="closeModal('searchModal')" style="background:#243447; margin-top:10px;">Закрыть</button>
  </div>
</div>

<!-- Панель создателя -->
<div class="modal" id="devModal">
  <div class="modal-box">
    <h3>Панель Создателя</h3>
    <div id="devContent"></div>
    <button onclick="closeModal('devModal')" style="background:#243447; margin-top:10px;">Закрыть</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myEmail = "";
let currentChatId = "";

function login() {
  const email = document.getElementById('email').value.trim();
  socket.emit('login_email', email);
}

socket.on('error', (msg) => { document.getElementById('error').innerText = msg; });

socket.on('logged_in', (email) => {
  myEmail = email;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (myEmail === "keshaneironchik@gmail.com") {
    document.getElementById('devBtn').classList.remove('hidden');
  }
  socket.emit('get_chats');
});

socket.on('chats_list', (chats) => {
  const box = document.getElementById('chatList');
  box.innerHTML = "";
  if (!chats || chats.length === 0) return box.innerHTML = "<p style='color:#7d8b99; text-align:center;'>Нет чатов.</p>";
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.onclick = () => openChat(c.id, c.name, c.bio);
    div.innerHTML = `
      <div class="avatar">${c.name.charAt(0).toUpperCase()}</div>
      <div style="flex:1;">
        <div class="chat-name">${c.name} ${c.type === 'channel' ? '📢' : c.type === 'bot' ? '🤖' : c.type === 'group' ? '👥' : ''}</div>
        <div class="chat-bio">${c.bio || 'Нет описания'}</div>
      </div>
    `;
    box.appendChild(div);
  });
});

// ПОИСК
function openSearch() {
  document.getElementById('searchModal').classList.add('show');
  document.getElementById('searchInput').value = "";
  document.getElementById('searchResults').innerHTML = "";
}
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (q.length < 2) return;
  socket.emit('search_users', q);
}
socket.on('search_results', (users) => {
  const box = document.getElementById('searchResults');
  box.innerHTML = "";
  if (users.length === 0) return box.innerHTML = "<p style='color:#7d8b99;'>Никого не найдено</p>";
  users.forEach(u => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.innerHTML = `<div class="avatar">${u.email.charAt(0).toUpperCase()}</div><div style="flex:1;"><div class="chat-name">${u.email}</div><div class="chat-bio">${u.bio || ''}</div></div>`;
    div.onclick = () => {
      socket.emit('create_chat', { type: 'chat', name: u.email, target: u.email });
      closeModal('searchModal');
    };
    box.appendChild(div);
  });
});

function createGroup() {
  const name = prompt("Название группы:");
  if (name) socket.emit('create_chat', { type: 'group', name });
}
function createChannel() {
  const name = prompt("Название канала:");
  if (name) socket.emit('create_chat', { type: 'channel', name });
}

socket.on('chat_created', () => { socket.emit('get_chats'); });

function openChat(id, name, bio) {
  currentChatId = id;
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  document.getElementById('chatBio').innerText = bio || '';
  socket.emit('join_chat', id);
}

socket.on('messages_history', (msgs) => {
  const box = document.getElementById('messages');
  box.innerHTML = "";
  msgs.forEach(m => renderMsg(m));
});

socket.on('new_message', (m) => {
  if (currentChatId === m.chat_id) renderMsg(m);
});

function renderMsg(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender === myEmail ? 'me' : 'them');
  let content = m.sender !== myEmail ? `<div class="sender">${m.sender}</div>` : '';
  content += `<div>${m.text}</div>`;
  div.innerHTML = content;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function backToList() {
  currentChatId = "";
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('listScreen').classList.remove('hidden');
  socket.emit('get_chats');
}

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentChatId) return;
  socket.emit('send_message', { chatId: currentChatId, text: text, type: 'text' });
  input.value = "";
}

// DEV ПАНЕЛЬ
function openDevPanel() {
  document.getElementById('devModal').classList.add('show');
  socket.emit('get_dev_data');
}
socket.on('dev_data', ({ users, chats }) => {
  const box = document.getElementById('devContent');
  let html = `<h4>Пользователи (${users.length}):</h4>`;
  users.forEach(u => { html += `<div style="font-size:13px; padding:3px 0;">${u.email}</div>`; });
  html += `<h4 style="margin-top:15px;">Чаты (${chats.length}):</h4>`;
  chats.forEach(c => {
    html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #243447;">
      <span style="font-size:13px;">${c.name} (${c.type})</span>
      <button onclick="deleteChat('${c.id}')" style="width:auto; padding:4px 8px; background:#7a2b2b; font-size:11px;">Удалить</button>
    </div>`;
  });
  box.innerHTML = html;
});

function deleteChat(id) {
  if (confirm("Удалить чат навсегда?")) socket.emit('delete_chat', id);
}
socket.on('chat_deleted', () => { alert("Чат удален"); socket.emit('get_dev_data'); socket.emit('get_chats'); });

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function logout() { location.reload(); }
</script>
</body>
  </html>
