<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neuron</title>
<style>
  :root { --bg: #0e1621; --bg2: #17212b; --text: #e6edf3; --accent: #2b5278; --accent2: #243447; --me: #2b5278; --them: #182533; }
  body.light { --bg: #f0f2f5; --bg2: #ffffff; --text: #1a1a1a; --accent: #d9ebff; --accent2: #e4e8ec; --me: #d9ebff; --them: #ffffff; }
  body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; transition: background 0.3s; }
  .hidden { display: none !important; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--accent2); background: var(--bg2); color: var(--text); font-size: 16px; box-sizing: border-box; outline: none; }
  button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  #chatList { flex: 1; overflow-y: auto; padding-bottom: 70px; }
  .chat-item { padding: 15px; background: var(--bg2); margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; overflow: hidden; flex-shrink: 0; position: relative; }
  .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: #238636; border-radius: 50%; border: 2px solid var(--bg2); }
  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; background: var(--bg2); padding: 10px; border-radius: 10px; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 80%; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
  .msg.me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
  .msg.them { background: var(--them); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg .sender { font-size: 12px; color: #58a6ff; font-weight: bold; margin-bottom: 3px; }
  .msg .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid #58a6ff; padding: 4px 8px; font-size: 12px; margin-bottom: 5px; border-radius: 4px; opacity: 0.8; }
  .msg .reactions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .msg .reactions span { background: var(--bg); padding: 2px 6px; border-radius: 10px; font-size: 12px; cursor: pointer; }
  .input-row { display: flex; gap: 5px; align-items: flex-end; }
  .input-row button { width: auto; margin: 0; padding: 12px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; padding: 20px; z-index: 100; }
  .modal.show { display: flex; }
  .modal-box { background: var(--bg2); padding: 20px; border-radius: 16px; }
  #typingIndicator { font-size: 12px; color: var(--text); opacity: 0.7; margin-left: 10px; }
  .sticker-panel { display: none; grid-template-columns: repeat(4, 1fr); gap: 5px; background: var(--bg2); padding: 10px; border-radius: 10px; margin-bottom: 5px; }
  .sticker-panel.show { display: grid; }
  .sticker-panel button { font-size: 24px; padding: 5px; background: var(--bg); border: none; }
  
  /* --- СТИЛИ ДЛЯ ЗВОНКА --- */
  #callModal { background: #000; display: none; flex-direction: column; justify-content: center; position: fixed; inset: 0; z-index: 200; }
  #callModal.show { display: flex; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
  #localVideo { width: 100px; height: 140px; object-fit: cover; position: absolute; top: 20px; right: 20px; z-index: 2; border-radius: 10px; border: 2px solid #fff; background: #222; }
  #callTitle { position: absolute; top: 20px; left: 20px; z-index: 2; color: white; font-size: 16px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
  #endCallBtn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2; background: #7a2b2b; padding: 15px 30px; font-size: 18px; border-radius: 30px; width: auto; }
</style>
</head>
<body>
<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="email" type="email" placeholder="Введите вашу почту">
  <button onclick="login()">Войти</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h3 style="margin:0;">Чаты</h3>
      <div style="display:flex; gap:5px;">
        <button onclick="toggleTheme()" style="width:auto; padding:8px; background:var(--accent2);">🌓</button>
        <button onclick="logout()" style="width:auto; padding:8px; background:#7a2b2b;">Выйти</button>
      </div>
    </div>
    <div style="display:flex; gap:5px; margin-bottom:10px;">
      <button onclick="openSearch()" style="padding:8px;">🔍 Поиск</button>
      <button onclick="createGroup()" style="padding:8px; background:#6d28d9;">+ Группа</button>
      <button id="devBtn" class="hidden" onclick="openDevPanel()" style="padding:8px; background:#8b5cf6;">DEV</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button onclick="backToList()" style="width:auto; background:transparent; color:var(--text); font-size:20px;">←</button>
      <div style="flex:1;">
        <div class="chat-name" id="chatWith"></div>
        <div class="chat-bio" id="chatBio"></div>
      </div>
      <button onclick="startCall()" style="width:auto; padding:8px; background:#238636;">📞</button>
    </div>
    <div id="typingIndicator" class="hidden">печатает...</div>
    <div id="messages"></div>
    <div class="sticker-panel" id="stickerPanel">
      <button onclick="sendSticker('😀')">😀</button><button onclick="sendSticker('😂')">😂</button>
      <button onclick="sendSticker('😍')">😍</button><button onclick="sendSticker('👍')">👍</button>
      <button onclick="sendSticker('🔥')">🔥</button><button onclick="sendSticker('❤️')">❤️</button>
    </div>
    <div class="input-row">
      <button onclick="toggleStickers()" style="background:var(--accent2);">😀</button>
      <input id="msgInput" placeholder="Сообщение..." oninput="onTyping()">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- Модалка поиска -->
<div class="modal" id="searchModal">
  <div class="modal-box">
    <h3>Поиск</h3>
    <input id="searchInput" placeholder="Почта..." oninput="doSearch()">
    <div id="searchResults"></div>
    <button onclick="closeModal('searchModal')" style="background:var(--accent2);">Закрыть</button>
  </div>
</div>

<!-- DEV -->
<div class="modal" id="devModal">
  <div class="modal-box">
    <h3>DEV</h3>
    <div id="devContent"></div>
    <button onclick="closeModal('devModal')" style="background:var(--accent2);">Закрыть</button>
  </div>
</div>

<!-- Модалка звонка -->
<div class="modal" id="callModal">
  <div id="callTitle">Звонок</div>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>
  <button id="endCallBtn" onclick="endCall()">Завершить</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myEmail = "", currentChatId = "", currentChatTarget = "";
let myStream = null, peerConnection = null, replyingToId = null;
let isLightTheme = false;

function login() { socket.emit('login_email', document.getElementById('email').value.trim()); }
socket.on('error', (m) => document.getElementById('error').innerText = m);

socket.on('logged_in', (email) => {
  myEmail = email;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (myEmail === "keshaneironchik@gmail.com") document.getElementById('devBtn').classList.remove('hidden');
  socket.emit('get_chats');
});

// ТЕМА
function toggleTheme() {
  isLightTheme = !isLightTheme;
  document.body.classList.toggle('light', isLightTheme);
}

// ЧАТЫ
socket.on('chats_list', (chats) => {
  const box = document.getElementById('chatList');
  box.innerHTML = "";
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.onclick = () => openChat(c.id, c.name, c.bio, c.members);
    div.innerHTML = `
      <div class="avatar">${c.name.charAt(0).toUpperCase()} ${c.isOnline ? '<div class="online-dot"></div>' : ''}</div>
      <div style="flex:1;"><div class="chat-name">${c.name}</div><div class="chat-bio">${c.bio || ''}</div></div>
    `;
    box.appendChild(div);
  });
});

// ПОИСК
function openSearch() { document.getElementById('searchModal').classList.add('show'); }
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (q.length > 1) socket.emit('search_users', q);
}
socket.on('search_results', (users) => {
  const box = document.getElementById('searchResults');
  box.innerHTML = "";
  users.forEach(u => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.innerHTML = `<div class="avatar">${u.email.charAt(0).toUpperCase()} ${u.last_seen > Date.now() - 60000 ? '<div class="online-dot"></div>' : ''}</div><div>${u.email}</div>`;
    div.onclick = () => { socket.emit('create_chat', { type: 'chat', name: u.email, target: u.email }); closeModal('searchModal'); };
    box.appendChild(div);
  });
});

function createGroup() { const name = prompt("Группа:"); if (name) socket.emit('create_chat', { type: 'group', name }); }
socket.on('chat_created', () => socket.emit('get_chats'));

// ОТКРЫТИЕ ЧАТА
function openChat(id, name, bio, members) {
  currentChatId = id;
  currentChatTarget = members ? members.split(',').find(m => m !== myEmail && m !== 'system') : "";
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  document.getElementById('chatBio').innerText = bio || '';
  socket.emit('join_chat', id);
  socket.emit('mark_read', { chatId: id, sender: myEmail });
}

socket.on('messages_history', (msgs) => {
  const box = document.getElementById('messages');
  box.innerHTML = "";
  msgs.forEach(m => renderMsg(m));
});

socket.on('new_message', (m) => {
  if (currentChatId === m.chat_id) {
    renderMsg(m);
    socket.emit('mark_read', { chatId: currentChatId, sender: myEmail });
  }
});

function renderMsg(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender === myEmail ? 'me' : 'them');
  div.id = 'msg_' + m.id;
  
  let pressTimer;
  div.addEventListener('touchstart', () => { pressTimer = setTimeout(() => showActions(m.id), 500); });
  div.addEventListener('touchend', () => clearTimeout(pressTimer));
  div.addEventListener('mousedown', () => { pressTimer = setTimeout(() => showActions(m.id), 500); });
  div.addEventListener('mouseup', () => clearTimeout(pressTimer));

  let content = m.sender !== myEmail ? `<div class="sender">${m.sender}</div>` : '';
  if (m.reply_to) content += `<div class="reply-quote">Ответ на сообщение</div>`;
  content += `<div>${m.text}</div>`;
  
  let reactionsHtml = '';
  if (m.reactions) {
    const rs = JSON.parse(m.reactions);
    reactionsHtml = `<div class="reactions">${Object.values(rs).map(r => `<span>${r}</span>`).join('')}</div>`;
  }

  div.innerHTML = content + reactionsHtml;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// РЕАКЦИИ И УДАЛЕНИЕ
function showActions(msgId) {
  const action = prompt("Действие: 1 - Реакция, 2 - Удалить, 3 - Ответ");
  if (action === '1') {
    const r = prompt("Эмодзи (👍, ❤️, 😂):");
    if (r) socket.emit('add_reaction', { chatId: currentChatId, msgId, reaction: r });
  } else if (action === '2') {
    if (confirm("Удалить?")) socket.emit('delete_message', { chatId: currentChatId, msgId });
  } else if (action === '3') {
    replyingToId = msgId;
    alert("Теперь напишите ответ");
  }
}

socket.on('message_reaction', ({ msgId, reactions }) => {
  const el = document.getElementById('msg_' + msgId);
  if (el) {
    let reactionsHtml = `<div class="reactions">${Object.values(reactions).map(r => `<span>${r}</span>`).join('')}</div>`;
    if (el.querySelector('.reactions')) el.querySelector('.reactions').outerHTML = reactionsHtml;
    else el.innerHTML += reactionsHtml;
  }
});
socket.on('message_deleted', (msgId) => document.getElementById('msg_' + msgId)?.remove());

// ПЕЧАТАЕТ
function onTyping() { socket.emit('typing', currentChatId); }
socket.on('user_typing', ({ chatId }) => {
  if (currentChatId === chatId) {
    const ind = document.getElementById('typingIndicator');
    ind.classList.remove('hidden');
    clearTimeout(ind.timer);
    ind.timer = setTimeout(() => ind.classList.add('hidden'), 2000);
  }
});

// СТАТУСЫ
socket.on('user_online', (email) => socket.emit('get_chats'));
socket.on('user_offline', (email) => socket.emit('get_chats'));

// ОТПРАВКА
function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  socket.emit('send_message', { chatId: currentChatId, text: text, type: 'text', reply_to: replyingToId });
  input.value = ""; replyingToId = null;
}

function toggleStickers() { document.getElementById('stickerPanel').classList.toggle('show'); }
function sendSticker(s) { socket.emit('send_message', { chatId: currentChatId, text: s, type: 'sticker' }); }

function backToList() {
  currentChatId = "";
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('listScreen').classList.remove('hidden');
  socket.emit('get_chats');
}

// ЗВОНКИ (WebRTC)
async function startCall() {
  if (!currentChatTarget) return alert("Нельзя позвонить в этот чат");
  document.getElementById('callModal').classList.add('show');
  document.getElementById('callTitle').innerText = "Звонок: " + currentChatTarget;
  
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = myStream;
  } catch(e) { return alert("Нет доступа к камере/микрофону"); }

  peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  myStream.getTracks().forEach(track => peerConnection.addTrack(track, myStream));
  
  peerConnection.ontrack = (event) => {
    document.getElementById('remoteVideo').srcObject = event.streams[0];
  };
  
  peerConnection.onicecandidate = (event) => {
    if (event.candidate) socket.emit('ice_candidate', { candidate: event.candidate });
  };

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('call_user', { to: currentChatTarget, offer });
}

socket.on('incoming_call', async ({ from, offer }) => {
  if (!confirm(`Входящий звонок от ${from}. Принять?`)) return;
  document.getElementById('callModal').classList.add('show');
  document.getElementById('callTitle').innerText = "Звонок: " + from;
  
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = myStream;
  } catch(e) { return alert("Ошибка доступа к камере"); }

  peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  myStream.getTracks().forEach(track => peerConnection.addTrack(track, myStream));
  
  peerConnection.ontrack = (event) => {
    document.getElementById('remoteVideo').srcObject = event.streams[0];
  };
  
  peerConnection.onicecandidate = (event) => {
    if (event.candidate) socket.emit('ice_candidate', { candidate: event.candidate });
  };

  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit('answer_call', { to: from, answer });
});

socket.on('call_answered', async ({ answer }) => {
  await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('ice_candidate', async ({ candidate }) => {
  if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
});

socket.on('call_ended', () => endCall());

function endCall() {
  document.getElementById('callModal').classList.remove('show');
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (myStream) { myStream.getTracks().forEach(t => t.stop()); myStream = null; }
  socket.emit('end_call', { to: currentChatTarget });
}

// DEV
function openDevPanel() { document.getElementById('devModal').classList.add('show'); socket.emit('get_dev_data'); }
socket.on('dev_data', ({ users, chats }) => {
  const box = document.getElementById('devContent');
  let html = `<h4>Пользователи:</h4>`;
  users.forEach(u => html += `<div>${u.email}</div>`);
  html += `<h4>Чаты:</h4>`;
  chats.forEach(c => html += `<div style="display:flex; justify-content:space-between; padding:5px 0;">${c.name} <button onclick="socket.emit('delete_chat', '${c.id}')" style="width:auto; padding:2px 5px; background:#7a2b2b;">X</button></div>`);
  box.innerHTML = html;
});
socket.on('chat_deleted', () => { socket.emit('get_chats'); });

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function logout() { location.reload(); }
</script>
</body>
  </html>
