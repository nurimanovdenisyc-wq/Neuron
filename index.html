<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Chat</title>
<style>
  body { font-family: sans-serif; background: #0e1621; color: #e6edf3; margin: 0; padding: 20px; }
  .hidden { display: none !important; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #243447; background: #17212b; color: white; font-size: 16px; box-sizing: border-box; }
  button { background: #2b5278; border: none; cursor: pointer; font-weight: bold; }
  #app { max-width: 600px; margin: 0 auto; }
  #chatBox { height: 50vh; overflow-y: auto; background: #17212b; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
  .msg { padding: 8px; border-radius: 8px; max-width: 80%; font-size: 14px; }
  .msg.me { background: #2b5278; align-self: flex-end; }
  .msg.them { background: #182533; align-self: flex-start; }
  .system { color: #7d8b99; font-size: 12px; text-align: center; margin: 5px 0; }
  .input-row { display: flex; gap: 5px; }
  .input-row input { margin: 0; }
  .input-row button { width: auto; margin: 0; padding: 12px 20px; }
</style>
</head>
<body>

<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="login" placeholder="Логин">
  <input id="pass" type="password" placeholder="Пароль">
  <button onclick="reg()">Зарегистрироваться</button>
  <button onclick="log()" style="background:#1c2a3a;">Войти</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
    <h3 style="margin:0;">Чат</h3>
    <button onclick="location.reload()" style="width:auto; padding:5px 10px; background:#7a2b2b;">Выйти</button>
  </div>
  <div id="chatBox"></div>
  <div class="input-row">
    <input id="msgInput" placeholder="Сообщение...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const err = document.getElementById('error');

function reg() {
  const login = document.getElementById('login').value;
  const pass = document.getElementById('pass').value;
  if(!login || !pass) return err.innerText = "Заполните всё";
  socket.emit('register', { login, pass });
}

function log() {
  const login = document.getElementById('login').value;
  const pass = document.getElementById('pass').value;
  socket.emit('login', { login, pass });
}

socket.on('registered', () => { err.innerText = "Готово! Теперь нажми Войти"; err.style.color = "green"; });
socket.on('error', (msg) => { err.innerText = msg; err.style.color = "red"; });

socket.on('logged_in', (user) => {
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
});

socket.on('message', (data) => {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + (data.user === document.getElementById('login').value ? 'me' : 'them');
  div.innerText = data.user + ": " + data.text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
});

socket.on('system', (msg) => {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'system';
  div.innerText = msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
});

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  socket.emit('message', text);
  input.value = "";
}
</script>
</body>
</html>
