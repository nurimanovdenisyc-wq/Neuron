<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neuron</title>
<style>
  :root { 
    --bg: #0e1621; --bg2: #17212b; --bg3: #1c2a3a; --text: #e6edf3; --muted: #7d8b99;
    --accent: #2b5278; --accent2: #4a7fb5; --me: #2b5278; --them: #182533; --border: #243447; 
  }
  body.light { 
    --bg: #f0f2f5; --bg2: #ffffff; --bg3: #e4e8ec; --text: #1a1a1a; --muted: #6a737d;
    --accent: #d9ebff; --accent2: #a0c4f0; --me: #d9ebff; --them: #ffffff; --border: #d0d7de; 
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }
  .hidden { display: none !important; }
  
  #auth { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 420px; margin: 0 auto; width: 100%; }
  #auth h2 { text-align: center; margin-bottom: 24px; font-size: 28px; }
  input, button { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 16px; outline: none; font-family: inherit; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
  button:active { background: var(--accent2); }
  
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--bg2); padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .topbar .title { flex: 1; font-size: 20px; font-weight: 700; }
  .topbar button { width: auto; padding: 8px 12px; margin: 0; font-size: 14px; background: var(--bg3); color: var(--text); }
  
  #chatList { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { padding: 12px 16px; background: var(--bg2); margin-bottom: 8px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); transition: background 0.1s; }
  .chat-item:active { background: var(--bg3); }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #fff; flex-shrink: 0; position: relative; }
  .online-dot { position: absolute; bottom: 0px; right: 0px; width: 14px; height: 14px; background: #238636; border-radius: 50%; border: 2px solid var(--bg2); }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; font-size: 16px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-last { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-size: cover; background-position: center; transition: background 0.3s; }
  .chat-header { background: var(--bg2); padding: 10px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10; opacity: 0.95; backdrop-filter: blur(5px); }
  .chat-header button.back { width: auto; padding: 0; margin: 0; background: transparent; color: var(--muted); font-size: 24px; }
  .chat-header .info { flex: 1; min-width: 0; }
  .chat-header .name { font-weight: 600; font-size: 16px; }
  .chat-header .status { font-size: 12px; color: var(--muted); }
  .chat-header button.icon { width: auto; padding: 8px; margin: 0; background: transparent; font-size: 18px; color: var(--text); }
  
  #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
  
  .msg { max-width: 80%; padding: 10px 14px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; animation: pop 0.2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  
  .skin-classic .msg { border-radius: 16px; }
  .skin-classic .msg.me { background: var(--me); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .skin-classic .msg.them { background: var(--them); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

  .skin-neon .msg { border-radius: 20px; border: 2px solid; }
  .skin-neon .msg.me { background: rgba(0, 255, 255, 0.1); color: #00ffff; align-self: flex-end; border-color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
  .skin-neon .msg.them { background: rgba(255, 0, 255, 0.1); color: #ff00ff; align-self: flex-start; border-color: #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3); }

  .skin-glass .msg { border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
  .skin-glass .msg.me { background: rgba(43, 82, 120, 0.6); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .skin-glass .msg.them { background: rgba(255, 255, 255, 0.1); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }

  .msg .sender { font-size: 12px; font-weight: 600; margin-bottom: 4px; opacity: 0.8; }
  .msg .time { font-size: 10px; text-align: right; margin-top: 4px; display: block; opacity: 0.6; }
  .msg .reply-quote { background: rgba(0,0,0,0.15); border-left: 3px solid currentColor; padding: 6px 10px; font-size: 12px; margin-bottom: 6px; border-radius: 6px; opacity: 0.9; }
  .msg .reactions { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .msg .reactions span { background: var(--bg); padding: 2px 8px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); }
  
  .input-bar { background: var(--bg2); padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--border); flex-shrink: 0; opacity: 0.95; backdrop-filter: blur(5px); }
  .input-bar .icon-btn { width: auto; padding: 10px; margin: 0; background: var(--bg3); color: var(--text); font-size: 20px; border-radius: 50%; }
  .input-bar input { margin: 0; border-radius: 24px; padding: 12px 18px; background: var(--bg); border: 1px solid var(--border); }
  .input-bar .send-btn { width: auto; padding: 12px 16px; margin: 0; border-radius: 50%; font-size: 18px; }
  
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; flex-direction: column; justify-content: center; padding: 20px; z-index: 100; backdrop-filter: blur(4px); }
  .modal.show { display: flex; }
  .modal-box { background: var(--bg2); padding: 20px; border-radius: 16px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border); }
  .modal-box h3 { margin-top: 0; }
  
  .sticker-panel { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; background: var(--bg2); padding: 10px; border-radius: 12px; margin: 0 10px 10px; border: 1px solid var(--border); }
  .sticker-panel.show { display: grid; }
  .sticker-panel button { font-size: 28px; padding: 8px; background: var(--bg); border: none; border-radius: 8px; }
  
  #callModal { background: #000; display: none; flex-direction: column; justify-content: center; position: fixed; inset: 0; z-index: 200; }
  #callModal.show { display: flex; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
  #localVideo { width: 100px; height: 140px; object-fit: cover; position: absolute; top: 20px; right: 20px; z-index: 2; border-radius: 12px; border: 2px solid #fff; background: #222; }
  #callTitle { position: absolute; top: 20px; left: 20px; z-index: 2; color: white; font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; }
  #endCallBtn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 2; background: #7a2b2b; padding: 15px 40px; font-size: 18px; border-radius: 30px; width: auto; font-weight: bold; }
</style>
</head>
<body>

<div id="auth">
  <h2>Neuron</h2>
  <input id="email" type="email" placeholder="Введите вашу почту">
  <button onclick="login()">Войти</button>
  <p id="error" style="color:#f85149; text-align:center; font-weight:bold;"></p>
</div>

<div id="app" class="hidden">
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar">
      <div class="title">Чаты</div>
      <button onclick="toggleTheme()">🌓</button>
      <button onclick="logout()" style="background:#7a2b2b;">Выйти</button>
    </div>
    <div style="display:flex; gap:8px; padding: 10px;">
      <button onclick="openSearch()" style="background:var(--bg3); color:var(--text);">🔍 Поиск</button>
      <button onclick="createGroup()" style="background:#6d28d9;">+ Группа</button>
      <button id="devBtn" class="hidden" onclick="openDevPanel()" style="background:#8b5cf6;">DEV</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="chatScreen" class="hidden skin-classic">
    <div class="chat-header">
      <button class="back" onclick="backToList()">←</button>
      <div class="avatar" id="chatAvatar" style="width:40px; height:40px; font-size:16px;"></div>
      <div class="info">
        <div class="name" id="chatWith"></div>
        <div class="status" id="chatBio"></div>
      </div>
      <button class="icon" onclick="openChatSettings()">⚙️</button>
      <button class="call" onclick="startCall()">📞</button>
    </div>
    
    <div id="messages"></div>
    
    <div class="sticker-panel" id="stickerPanel">
      <button onclick="sendSticker('😀')">😀</button><button onclick="sendSticker('😂')">😂</button>
      <button onclick="sendSticker('😍')">😍</button><button onclick="sendSticker('👍')">👍</button>
      <button onclick="sendSticker('🔥')">🔥</button><button onclick="sendSticker('❤️')">❤️</button>
      <button onclick="sendSticker('🎉')">🎉</button><button onclick="sendSticker('😎')">😎</button>
      <button onclick="sendSticker('🤔')">🤔</button><button onclick="sendSticker('😭')">😭</button>
    </div>
    
    <div class="input-bar">
      <button class="icon-btn" onclick="toggleStickers()">😀</button>
      <input id="msgInput" placeholder="Сообщение..." oninput="onTyping()">
      <button class="send-btn" onclick="send()">➤</button>
    </div>
  </div>
</div>

<div class="modal" id="searchModal">
  <div class="modal-box">
    <h3>Поиск людей</h3>
    <input id="searchInput" placeholder="Введите почту..." oninput="doSearch()">
    <div id="searchResults"></div>
    <button onclick="closeModal('searchModal')" style="background:var(--bg3); color:var(--text); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="chatSettingsModal">
  <div class="modal-box">
    <h3>Настройки чата</h3>
    
    <p style="margin-top:10px;">Фон чата:</p>
    <button onclick="uploadBg()" style="background:#238636;">📷 Загрузить с телефона</button>
    <button onclick="removeBg()" style="background:#7a2b2b;">Убрать фон</button>
    
    <p style="margin-top:15px;">Скин пузырей:</p>
    <div style="display:flex; gap:10px;">
      <button onclick="changeSkin('classic')" style="padding:8px; font-size:12px;">Классика</button>
      <button onclick="changeSkin('neon')" style="padding:8px; font-size:12px; background:#005555;">Неон</button>
      <button onclick="changeSkin('glass')" style="padding:8px; font-size:12px; background:#555555;">Стекло</button>
    </div>
    
    <button onclick="closeModal('chatSettingsModal')" style="background:var(--bg3); color:var(--text); margin-top:20px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="devModal">
  <div class="modal-box">
    <h3>Панель Создателя</h3>
    <div id="devContent"></div>
    <button onclick="closeModal('devModal')" style="background:var(--bg3); color:var(--text); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="callModal">
  <div id="callTitle">Звонок</div>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>
  <button id="endCallBtn" onclick="endCall()">Завершить</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myEmail = "", currentChatId = "", currentChatTarget = "";
let myStream = null, peerConnection = null, replyingToId = null;
let isLightTheme = false;

function login() { socket.emit('login_email', document.getElementById('email').value.trim()); }
socket.on('error', (m) => document.getElementById('error').innerText = m);

socket.on('logged_in', (email) => {
  myEmail = email;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (myEmail === "keshaneironchik@gmail.com") document.getElementById('devBtn').classList.remove('hidden');
  socket.emit('get_chats');
});

function toggleTheme() {
  isLightTheme = !isLightTheme;
  document.body.classList.toggle('light', isLightTheme);
}

socket.on('chats_list', (chats) => {
  const box = document.getElementById('chatList');
  box.innerHTML = "";
  if (!chats || chats.length === 0) {
    box.innerHTML = "<p style='text-align:center; color:var(--muted); padding:20px;'>Нет чатов. Найдите друга через поиск!</p>";
    return;
  }
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.onclick = () => openChat(c.id, c.name, c.bio, c.members);
    div.innerHTML = `
      <div class="avatar">${c.name.charAt(0).toUpperCase()} ${c.isOnline ? '<div class="online-dot"></div>' : ''}</div>
      <div class="chat-info">
        <div class="chat-name">${c.name} ${c.type === 'channel' ? '📢' : c.type === 'bot' ? '🤖' : c.type === 'group' ? '👥' : ''}</div>
        <div class="chat-last">${c.bio || 'Нажмите чтобы открыть'}</div>
      </div>
    `;
    box.appendChild(div);
  });
});

function openSearch() { document.getElementById('searchModal').classList.add('show'); }
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (q.length > 1) socket.emit('search_users', q);
}
socket.on('search_results', (users) => {
  const box = document.getElementById('searchResults');
  box.innerHTML = "";
  if (users.length === 0) return box.innerHTML = "<p style='color:var(--muted);'>Никого не найдено</p>";
  users.forEach(u => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.innerHTML = `<div class="avatar">${u.email.charAt(0).toUpperCase()}</div><div class="chat-info"><div class="chat-name">${u.email}</div><div class="chat-last">${u.bio || ''}</div></div>`;
    div.onclick = () => { socket.emit('create_chat', { type: 'chat', name: u.email, target: u.email }); closeModal('searchModal'); };
    box.appendChild(div);
  });
});

function createGroup() { const name = prompt("Название группы:"); if (name) socket.emit('create_chat', { type: 'group', name }); }
socket.on('chat_created', () => socket.emit('get_chats'));

function openChat(id, name, bio, members) {
  currentChatId = id;
  currentChatTarget = members ? members.split(',').find(m => m !== myEmail && m !== 'system') : "";
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  document.getElementById('chatBio').innerText = bio || 'в сети';
  document.getElementById('chatAvatar').innerHTML = name.charAt(0).toUpperCase();
  
  const savedBg = localStorage.getItem('bg_' + id);
  const savedSkin = localStorage.getItem('skin_' + id);
  const chatScreen = document.getElementById('chatScreen');
  chatScreen.style.backgroundImage = savedBg ? `url(${savedBg})` : 'none';
  chatScreen.className = 'skin-' + (savedSkin || 'classic');

  socket.emit('join_chat', id);
  socket.emit('mark_read', { chatId: id, sender: myEmail });
}

// --- НАСТРОЙКИ ЧАТА ---
function openChatSettings() { document.getElementById('chatSettingsModal').classList.add('show'); }

function uploadBg() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    
    const formData = new FormData();
    formData.append('image', file);
    
    alert("Загрузка...");
    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.url) {
        document.getElementById('chatScreen').style.backgroundImage = `url(${data.url})`;
        localStorage.setItem('bg_' + currentChatId, data.url);
        alert("Фон установлен!");
      } else {
        alert("Ошибка загрузки");
      }
    } catch(e) { alert("Ошибка сети"); }
  };
  input.click();
}

function removeBg() {
  document.getElementById('chatScreen').style.backgroundImage = 'none';
  localStorage.removeItem('bg_' + currentChatId);
  closeModal('chatSettingsModal');
}

function changeSkin(skin) {
  document.getElementById('chatScreen').className = 'skin-' + skin;
  localStorage.setItem('skin_' + currentChatId, skin);
  closeModal('chatSettingsModal');
}

socket.on('messages_history', (msgs) => {
  const box = document.getElementById('messages');
  box.innerHTML = "";
  msgs.forEach(m => renderMsg(m));
});

socket.on('new_message', (m) => {
  if (currentChatId === m.chat_id) {
    renderMsg(m);
    socket.emit('mark_read', { chatId: currentChatId, sender: myEmail });
  }
});

function renderMsg(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender === myEmail ? 'me' : 'them');
  div.id = 'msg_' + m.id;
  
  let pressTimer;
  div.addEventListener('touchstart', () => { pressTimer = setTimeout(() => showActions(m.id), 500); });
  div.addEventListener('touchend', () => clearTimeout(pressTimer));
  div.addEventListener('mousedown', () => { pressTimer = setTimeout(() => showActions(m.id), 500); });
  div.addEventListener('mouseup', () => clearTimeout(pressTimer));

  let content = m.sender !== myEmail ? `<div class="sender">${m.sender}</div>` : '';
  if (m.reply_to) content += `<div class="reply-quote">Ответ на сообщение</div>`;
  content += `<div>${m.text}</div>`;
  content += `<span class="time">${new Date().getHours()}:${new Date().getMinutes().toString().padStart(2, '0')}</span>`;
  
  let reactionsHtml = '';
  if (m.reactions) {
    const rs = JSON.parse(m.reactions);
    reactionsHtml = `<div class="reactions">${Object.values(rs).map(r => `<span>${r}</span>`).join('')}</div>`;
  }

  div.innerHTML = content + reactionsHtml;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showActions(msgId) {
  const action = prompt("1 - Реакция, 2 - Удалить, 3 - Ответ");
  if (action === '1') {
    const r = prompt("Эмодзи (👍, ❤️, 😂):");
    if (r) socket.emit('add_reaction', { chatId: currentChatId, msgId, reaction: r });
  } else if (action === '2') {
    if (confirm("Удалить?")) socket.emit('delete_message', { chatId: currentChatId, msgId });
  } else if (action === '3') {
    replyingToId = msgId;
    alert("Напишите ответ");
  }
}

socket.on('message_reaction', ({ msgId, reactions }) => {
  const el = document.getElementById('msg_' + msgId);
  if (el) {
    let reactionsHtml = `<div class="reactions">${Object.values(reactions).map(r => `<span>${r}</span>`).join('')}</div>`;
    if (el.querySelector('.reactions')) el.querySelector('.reactions').outerHTML = reactionsHtml;
    else el.innerHTML += reactionsHtml;
  }
});
socket.on('message_deleted'
