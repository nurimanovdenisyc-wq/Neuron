<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neuron Chat</title>
<style>
  body { font-family: sans-serif; background: #0e1621; color: #e6edf3; margin: 0; padding: 15px; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; }
  .hidden { display: none !important; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #243447; background: #17212b; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
  button { background: #2b5278; border: none; cursor: pointer; font-weight: bold; }
  
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  
  /* Список чатов */
  #chatList { flex: 1; overflow-y: auto; padding-bottom: 70px; }
  .chat-item { padding: 15px; background: #17212b; margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .chat-item:active { background: #243447; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #2b5278; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  .bot-avatar { background: #238636; }
  .chat-info { flex: 1; overflow: hidden; }
  .chat-name { font-weight: bold; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-last { font-size: 13px; color: #7d8b99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  
  /* Экран чата */
  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
  .chat-header button { width: auto; padding: 8px 12px; margin: 0; background: #243447; }
  #messages { flex: 1; overflow-y: auto; background: #17212b; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 12px; border-radius: 14px; max-width: 80%; font-size: 14px; line-height: 1.4; }
  .msg.me { background: #2b5278; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.them { background: #182533; align-self: flex-start; border-bottom-left-radius: 4px; }
  .input-row { display: flex; gap: 5px; }
  .input-row input { margin: 0; }
  .input-row button { width: auto; margin: 0; padding: 12px 20px; }

  /* Плавающая кнопка создания чата */
  #fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #2b5278; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
</style>
</head>
<body>

<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="login" placeholder="Логин">
  <input id="pass" type="password" placeholder="Пароль">
  <button onclick="reg()">Зарегистрироваться</button>
  <button onclick="log()" style="background:#1c2a3a;">Войти</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <!-- СПИСОК ЧАТОВ -->
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 style="margin:0;">Мои чаты</h3>
      <button onclick="logout()" style="width:auto; padding:8px 12px; background:#7a2b2b;">Выйти</button>
    </div>
    <div id="chatList"></div>
    <div id="fab" onclick="createChat()">+</div>
  </div>

  <!-- ЭКРАН ЧАТА -->
  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button onclick="backToList()">← Назад</button>
      <h4 id="chatWith" style="margin:0;"></h4>
    </div>
    <div id="messages"></div>
    <div class="input-row">
      <input id="msgInput" placeholder="Сообщение...">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const err = document.getElementById('error');
let myLogin = "";
let currentChatId = "";
let currentChatTarget = "";
let myChats = [];

function reg() {
  const login = document.getElementById('login').value.trim();
  const pass = document.getElementById('pass').value.trim();
  if(!login || !pass) return err.innerText = "Заполните всё";
  socket.emit('register', { login, pass });
}

function log() {
  const login = document.getElementById('login').value.trim();
  const pass = document.getElementById('pass').value.trim();
  socket.emit('login', { login, pass });
}

function logout() { location.reload(); }

socket.on('registered', () => { err.innerText = "Готово! Теперь нажми Войти"; err.style.color = "green"; });
socket.on('error', (msg) => { err.innerText = msg; err.style.color = "red"; });

socket.on('logged_in', (user, chats) => {
  myLogin = user;
  myChats = chats || [];
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderChats();
});

socket.on('chats_list', (chats) => {
  myChats = chats || [];
  renderChats();
});

function renderChats() {
  const box = document.getElementById('chatList');
  box.innerHTML = "";
  if (myChats.length === 0) {
    box.innerHTML = "<p style='color:#7d8b99; text-align:center; padding:20px;'>У вас пока нет чатов.<br>Нажмите + чтобы создать.</p>";
    return;
  }
  
  myChats.forEach(c => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.onclick = () => openChat(c.id, c.name);
    
    const isBot = c.name === "Neuron Guide";
    const lastMsg = c.messages && c.messages.length > 0 ? c.messages[c.messages.length - 1].text : "Нет сообщений";
    
    div.innerHTML = `
      <div class="avatar ${isBot ? 'bot-avatar' : ''}">${c.name.charAt(0).toUpperCase()}</div>
      <div class="chat-info">
        <div class="chat-name">${c.name} ${isBot ? '🤖' : ''}</div>
        <div class="chat-last">${lastMsg}</div>
      </div>
    `;
    box.appendChild(div);
  });
}

function createChat() {
  const name = prompt("Введите логин друга (или название чата):");
  if (!name) return;
  socket.emit('create_chat', name);
}

socket.on('chat_created', (chat) => {
  myChats.push(chat);
  renderChats();
});

function openChat(id, name) {
  currentChatId = id;
  currentChatTarget = name;
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  
  const chat = myChats.find(c => c.id === id);
  const box = document.getElementById('messages');
  box.innerHTML = "";
  
  if (chat && chat.messages) {
    chat.messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.from === myLogin ? 'me' : 'them');
      div.innerText = m.text;
      box.appendChild(div);
    });
  }
  box.scrollTop = box.scrollHeight;
}

function backToList() {
  currentChatId = "";
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('listScreen').classList.remove('hidden');
  socket.emit('get_chats');
}

socket.on('new_message', (data) => {
  // Если мы в этом чате, добавляем на экран
  if (currentChatId === data.chatId) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + (data.from === myLogin ? 'me' : 'them');
    div.innerText = data.text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }
  
  // Обновляем локальный кэш
  const chat = myChats.find(c => c.id === data.chatId);
  if (chat) {
    if (!chat.messages) chat.messages = [];
    chat.messages.push({ from: data.from, text: data.text });
  } else {
    socket.emit('get_chats');
  }
});

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentChatId) return;
  
  const isBot = currentChatTarget === "Neuron Guide";
  const to = isBot ? "bot" : currentChatTarget;
  
  socket.emit('private_message', { chatId: currentChatId, to: to, text: text });
  input.value = "";
}
</script>
</body>
</html>
