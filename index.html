<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neuron</title>
<style>
  :root { --bg: #0e1621; --bg2: #17212b; --bg3: #1c2a3a; --text: #e6edf3; --muted: #7d8b99; --accent: #2b5278; --me: #2b5278; --them: #182533; --border: #243447; }
  body.light { --bg: #f0f2f5; --bg2: #ffffff; --bg3: #e4e8ec; --text: #1a1a1a; --muted: #6a737d; --accent: #d9ebff; --me: #d9ebff; --them: #ffffff; --border: #d0d7de; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; height: 100dvh; display: flex; flex-direction: column; transition: background 0.3s; }
  .hidden { display: none !important; }
  input, button { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 16px; outline: none; }
  button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: var(--bg2); padding: 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .topbar .title { flex: 1; font-size: 20px; font-weight: 700; }
  .topbar button { width: auto; padding: 8px 12px; margin: 0; font-size: 14px; background: var(--bg3); }
  
  #chatList { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { padding: 12px; background: var(--bg2); margin-bottom: 8px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
  .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: white; position: relative; }
  .online-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #238636; border-radius: 50%; border: 2px solid var(--bg2); }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: bold; font-size: 16px; }
  .chat-last { font-size: 13px; color: var(--muted); }

  #chatScreen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { background: var(--bg2); padding: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .chat-header button { width: auto; padding: 8px; margin: 0; background: transparent; font-size: 20px; color: var(--text); }
  #chatBio { font-size: 12px; color: var(--muted); }
  
  #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 80%; padding: 10px 14px; font-size: 15px; line-height: 1.4; border-radius: 16px; word-wrap: break-word; position: relative; }
  .msg.me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 4px; color: white; }
  .msg.them { background: var(--them); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .msg .sender { font-size: 12px; color: #58a6ff; font-weight: bold; margin-bottom: 4px; }
  .msg .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid #58a6ff; padding: 4px 8px; font-size: 12px; margin-bottom: 5px; border-radius: 4px; }
  .msg .reactions { display: flex; gap: 4px; margin-top: 4px; }
  .msg .reactions span { background: var(--bg); padding: 2px 6px; border-radius: 10px; font-size: 12px; border: 1px solid var(--border); }
  .msg img.sticker { width: 100px; height: 100px; object-fit: contain; }

  .input-bar { background: var(--bg2); padding: 10px; display: flex; gap: 8px; border-top: 1px solid var(--border); }
  .input-bar input { margin: 0; border-radius: 20px; }
  .input-bar button { width: auto; padding: 12px 20px; margin: 0; border-radius: 20px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; padding: 20px; z-index: 100; }
  .modal.show { display: flex; }
  .modal-box { background: var(--bg2); padding: 20px; border-radius: 16px; max-height: 80vh; overflow-y: auto; }

  .sticker-panel { display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; background: var(--bg2); padding: 10px; border-radius: 12px; margin: 0 10px 10px; border: 1px solid var(--border); }
  .sticker-panel.show { display: grid; }
  .sticker-panel img { width: 100%; height: 60px; object-fit: contain; cursor: pointer; }
  .sticker-panel button { font-size: 20px; padding: 5px; background: var(--bg3); }

  #callModal { background: #000; display: none; flex-direction: column; justify-content: center; position: fixed; inset: 0; z-index: 200; }
  #callModal.show { display: flex; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
  #localVideo { width: 100px; height: 140px; object-fit: cover; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid #fff; }
  #callTitle { position: absolute; top: 20px; left: 20px; color: white; font-size: 16px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; }
  #endCallBtn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #7a2b2b; padding: 15px 40px; font-size: 18px; border-radius: 30px; width: auto; }
</style>
</head>
<body>

<div id="auth">
  <h2 style="text-align:center;">Neuron</h2>
  <input id="nick" placeholder="Введите ваш ник (мин. 3 символа)">
  <button onclick="login()">Войти / Зарегистрироваться</button>
  <p id="error" style="color:red; text-align:center;"></p>
</div>

<div id="app" class="hidden">
  <div id="listScreen" style="display:flex; flex-direction:column; height:100%;">
    <div class="topbar">
      <div class="title">Чаты</div>
      <button onclick="toggleTheme()">🌓</button>
      <button onclick="logout()" style="background:#7a2b2b;">Выйти</button>
    </div>
    <div style="display:flex; gap:8px; padding: 10px;">
      <button onclick="openSearch()">🔍 Поиск</button>
      <button onclick="createGroup()" style="background:#6d28d9;">+ Группа</button>
      <button id="devBtn" class="hidden" onclick="openDevPanel()" style="background:#8b5cf6;">DEV</button>
    </div>
    <div id="chatList"></div>
  </div>

  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button onclick="backToList()">←</button>
      <div class="avatar" id="chatAvatar" style="width:40px; height:40px; font-size:16px;"></div>
      <div style="flex:1;">
        <div class="chat-name" id="chatWith"></div>
        <div id="chatBio"></div>
      </div>
      <button onclick="startCall()" style="background:#238636; border-radius:50%;">📞</button>
    </div>

    <div class="sticker-panel" id="stickerPanel">
      <button onclick="addNewSticker()" style="grid-column: span 4; background:#2b5278;">+ Добавить стикер</button>
    </div>

    <div id="messages"></div>
    <div class="input-bar">
      <button onclick="toggleStickers()" style="background:var(--bg3);">😀</button>
      <input id="msgInput" placeholder="Сообщение..." oninput="onTyping()">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<div class="modal" id="searchModal">
  <div class="modal-box">
    <h3>Поиск по нику</h3>
    <input id="searchInput" placeholder="Введите ник..." oninput="doSearch()">
    <div id="searchResults"></div>
    <button onclick="closeModal('searchModal')" style="background:var(--bg3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="devModal">
  <div class="modal-box">
    <h3>DEV</h3>
    <div id="devContent"></div>
    <button onclick="closeModal('devModal')" style="background:var(--bg3); margin-top:10px;">Закрыть</button>
  </div>
</div>

<div class="modal" id="callModal">
  <div id="callTitle">Звонок</div>
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>
  <button id="endCallBtn" onclick="endCall()">Завершить</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myNick = "", currentChatId = "", currentChatTarget = "";
let myStream = null, peerConnection = null, replyingToId = null;
let isLightTheme = false;

function login() { 
  const nick = document.getElementById('nick').value.trim();
  if(nick.length >= 3) socket.emit('login_nick', nick); 
  else document.getElementById('error').innerText = "Ник слишком короткий";
}
socket.on('error', (m) => document.getElementById('error').innerText = m);

socket.on('logged_in', (nick) => {
  myNick = nick;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if (myNick === "keshaneironchik") document.getElementById('devBtn').classList.remove('hidden');
  socket.emit('get_chats');
  socket.emit('get_stickers');
});

function toggleTheme() {
  isLightTheme = !isLightTheme;
  document.body.classList.toggle('light', isLightTheme);
}

// --- УВЕДОМЛЕНИЯ И ПЕЧАТАЕТ ---
function onTyping() { socket.emit('typing', currentChatId); }
socket.on('user_typing', ({ chatId }) => {
  if (currentChatId === chatId) {
    const bio = document.getElementById('chatBio');
    bio.innerText = "печатает...";
    clearTimeout(bio.timer);
    bio.timer = setTimeout(() => bio.innerText = "в сети", 2000);
  }
});

// --- СТИКЕРЫ ---
function toggleStickers() {
  document.getElementById('stickerPanel').classList.toggle('show');
}
socket.on('stickers_list', (stickers) => {
  const panel = document.getElementById('stickerPanel');
  panel.innerHTML = '<button onclick="addNewSticker()" style="grid-column: span 4; background:#2b5278;">+ Добавить стикер</button>';
  stickers.forEach(s => {
    const img = document.createElement('img');
    img.src = s.url;
    img.onclick = () => sendSticker(s.url);
    panel.appendChild(img);
  });
});
function addNewSticker() {
  const url = prompt("Введите ссылку на картинку (URL):");
  if (url) { socket.emit('add_sticker', url); alert("Стикер добавлен!"); }
}
function sendSticker(url) {
  if (!currentChatId) return;
  socket.emit('send_message', { chatId: currentChatId, type: 'sticker', file_url: url });
}

// --- ЧАТЫ ---
socket.on('chats_list', (chats) => {
  const box = document.getElementById('chatList');
  box.innerHTML = "";
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.onclick = () => openChat(c.id, c.name, c.bio, c.members);
    div.innerHTML = `
      <div class="avatar">${c.name.charAt(0).toUpperCase()} ${c.isOnline ? '<div class="online-dot"></div>' : ''}</div>
      <div class="chat-info">
        <div class="chat-name">${c.name} ${c.type === 'bot' ? '🤖' : c.type === 'group' ? '👥' : ''}</div>
        <div class="chat-last">${c.bio || ''}</div>
      </div>
    `;
    box.appendChild(div);
  });
});

function openSearch() { document.getElementById('searchModal').classList.add('show'); }
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (q.length > 1) socket.emit('search_users', q);
}
socket.on('search_results', (users) => {
  const box = document.getElementById('searchResults');
  box.innerHTML = "";
  users.forEach(u => {
    const div = document.createElement('div');
    div.className = "chat-item";
    div.innerHTML = `<div class="avatar">${u.nick.charAt(0).toUpperCase()}</div><div>${u.nick}</div>`;
    div.onclick = () => { socket.emit('create_chat', { type: 'chat', name: u.nick, target: u.nick }); closeModal('searchModal'); };
    box.appendChild(div);
  });
});

function createGroup() { const name = prompt("Название группы:"); if (name) socket.emit('create_chat', { type: 'group', name }); }
socket.on('chat_created', () => socket.emit('get_chats'));

function openChat(id, name, bio, members) {
  currentChatId = id;
  currentChatTarget = members ? members.split(',').find(m => m !== myNick && m !== 'system') : "";
  document.getElementById('listScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('chatWith').innerText = name;
  document.getElementById('chatBio').innerText = bio || 'в сети';
  document.getElementById('chatAvatar').innerHTML = name.charAt(0).toUpperCase();
  socket.emit('join_chat', id);
}

socket.on('messages_history', (msgs) => {
  const box = document.getElementById('messages');
  box.innerHTML = "";
  msgs.forEach(m => renderMsg(m));
});

socket.on('new_message', (m) => {
  if (currentChatId === m.chat_id) renderMsg(m);
});

function renderMsg(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.sender === myNick ? 'me' : 'them');
  div.id = 'msg_' + m.id;
  
  // Долгое нажатие для удаления/реакций/ответа
  let pressTimer;
  div.addEventListener('touchstart', () => { pressTimer = setTimeout(() => showActions(m.id), 500); });
  div.addEventListener('touchend', () => clearTimeout(pressTimer));
  div.addEventListener('mousedown', () => { pressTimer = setTimeout(() => showActions(m.id), 500); });
  div.addEventListener('mouseup', () => clearTimeout(pressTimer));

  let content = m.sender !== myNick ? `<div class="sender">${m.sender}</div>` : '';
  if (m.reply_to) content += `<div class="reply-quote">Ответ на сообщение</div>`;
  if (m.type === 'sticker' && m.file_url) content += `<img class="sticker" src="${m.file_url}">`;
  else content += `<div>${m.text}</div>`;
  
  let reactionsHtml = '';
  if (m.reactions) {
    const rs = JSON.parse(m.reactions);
    reactionsHtml = `<div class="reactions">${Object.values(rs).map(r => `<span>${r}</span>`).join('')}</div>`;
  }
  div.innerHTML = content + reactionsHtml;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showActions(msgId) {
  const action = prompt("1 - Реакция, 2 - Удалить, 3 - Ответ");
  if (action === '1') {
    const r = prompt("Эмодзи:");
    if (r) socket.emit('add_reaction', { chatId: currentChatId, msgId, reaction: r });
  } else if (action === '2') {
    if (confirm("Удалить?")) socket.emit('delete_message', { chatId: currentChatId, msgId });
  } else if (action === '3') {
    replyingToId = msgId;
    alert("Напишите ответ");
  }
}

socket.on('message_reaction', ({ msgId, reactions }) => {
  const el = document.getElementById('msg_' + msgId);
  if (el) {
    let reactionsHtml = `<div class="reactions">${Object.values(reactions).map(r => `<span>${r}</span>`).join('')}</div>`;
    if (el.querySelector('.reactions')) el.querySelector('.reactions').outerHTML = reactionsHtml;
    else el.innerHTML += reactionsHtml;
  }
});
socket.on('message_deleted', (msgId) => document.getElementById('msg_' + msgId)?.remove());

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  socket.emit('send_message', { chatId: currentChatId, text: text, type: 'text', reply_to: replyingToId });
  input.value = ""; replyingToId = null;
}

function backToList() {
  currentChatId = "";
  document.getElementById('chatScreen').classList.add('hidden');
  document.getElementById('listScreen').classList.remove('hidden');
  socket.emit('get_chats');
}

// --- ЗВОНКИ ---
async function startCall() {
  if (!currentChatTarget) return alert("Нельзя позвонить");
  document.getElementById('callModal').classList.add('show');
  document.getElementById('callTitle').innerText = "Звонок: " + currentChatTarget;
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = myStream;
  } catch(e) { return alert("Нет камеры"); }

  peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  myStream.getTracks().forEach(track => peerConnection.addTrack(track, myStream));
  peerConnection.ontrack = (event) => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
  peerConnection.onicecandidate = (event) => { if (event.candidate) socket.emit('ice_candidate', { candidate: event.candidate }); };
  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit('call_user', { to: currentChatTarget, offer });
}

socket.on('incoming_call', async ({ from, offer }) => {
  if (!confirm(`Звонок от ${from}. Принять?`)) return;
  document.getElementById('callModal').classList.add('show');
  document.getElementById('callTitle').innerText = "Звонок: " + from;
  try {
    myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById('localVideo').srcObject = myStream;
  } catch(e) { return alert("Ошибка камеры"); }

  peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  myStream.getTracks().forEach(track => peerConnection.addTrack(track, myStream));
  peerConnection.ontrack = (event) => { document.getElementById('remoteVideo').srcObject = event.streams[0]; };
  peerConnection.onicecandidate = (event) => { if (event.candidate) socket.emit('ice_candidate', { candidate: event.candidate }); };
  await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit('answer_call', { to: from, answer });
});

socket.on('call_answered', async ({ answer }) => { await peerConnection.setRemoteDescription(new RTCSessionDescription(answer)); });
socket.on('ice_candidate', async ({ candidate }) => { if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); });
socket.on('call_ended', () => endCall());

function endCall() {
  document.getElementById('callModal').classList.remove('show');
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (myStream) { myStream.getTracks().forEach(t => t.stop()); myStream = null; }
  socket.emit('end_call', { to: currentChatTarget });
}

// --- DEV ---
function openDevPanel() { document.getElementById('devModal').classList.add('show'); socket.emit('get_dev_data'); }
socket.on('dev_data', ({ users, chats }) => {
  const box = document.getElementById('devContent');
  let html = `<h4>Пользователи:</h4>`;
  users.forEach(u => html += `<div>${u.nick}</div>`);
  html += `<h4>Чаты:</h4>`;
  chats.forEach(c => html += `<div style="display:flex; justify-content:space-between; padding:5px 0;">${c.name} <button onclick="socket.emit('delete_chat', '${c.id}')" style="width:auto; padding:2px 5px; background:#7a2b2b;">X</button></div>`);
  box.innerHTML = html;
});

function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function logout() { location.reload(); }
</script>
</body>
  </html>
